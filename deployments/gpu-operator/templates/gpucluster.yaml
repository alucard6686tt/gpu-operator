{{- if .Values.gpuCluster.enabled }}
{{- $dra := .Values.gpuCluster.draDriver }}
{{- $gfd := .Values.gfd }}
{{- $dcgm := .Values.dcgm }}
{{- $dcgmExporter := .Values.dcgmExporter }}
apiVersion: nvidia.com/v1alpha1
kind: GPUCluster
metadata:
  name: gpu-cluster
  labels:
    {{- include "gpu-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: "gpu-operator"
  {{- if .Values.operator.cleanupCRD }}
  # CR cleanup is handled during pre-delete hook
  # Add below annotation so that helm doesn't attempt to cleanup CR twice
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
spec:
  draDriver:
    repository: {{ $dra.repository }}
    image: {{ $dra.image }}
    version: {{ $dra.version }}
    {{- if $dra.imagePullPolicy }}
    imagePullPolicy: {{ $dra.imagePullPolicy }}
    {{- end }}
    {{- with $dra.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $dra.featureGates }}
    featureGates:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    gpus:
      enabled: {{ $dra.gpus.enabled }}
      {{- with $dra.gpus.kubeletPlugin }}
      kubeletPlugin:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    computeDomains:
      enabled: {{ $dra.computeDomains.enabled }}
      {{- with $dra.computeDomains.controller }}
      controller:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $dra.computeDomains.kubeletPlugin }}
      kubeletPlugin:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- with $gfd }}
  gfd:
    enabled: {{ .enabled }}
    repository: {{ .repository }}
    image: {{ .image }}
    version: {{ .version }}
    {{- if .imagePullPolicy }}
    imagePullPolicy: {{ .imagePullPolicy }}
    {{- end }}
    {{- with .imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .env }}
    env:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with $dcgm }}
  dcgm:
    enabled: {{ .enabled }}
    repository: {{ .repository }}
    image: {{ .image }}
    version: {{ .version }}
    {{- if .imagePullPolicy }}
    imagePullPolicy: {{ .imagePullPolicy }}
    {{- end }}
    {{- with .imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .args }}
    args:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .env }}
    env:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    hostNetwork: {{ .hostNetwork }}
  {{- end }}
  {{- with $dcgmExporter }}
  dcgmExporter:
    enabled: {{ .enabled }}
    repository: {{ .repository }}
    image: {{ .image }}
    version: {{ .version }}
    {{- if .imagePullPolicy }}
    imagePullPolicy: {{ .imagePullPolicy }}
    {{- end }}
    {{- with .imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .args }}
    args:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .env }}
    env:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    hostPID: {{ .hostPID }}
    hostNetwork: {{ .hostNetwork }}
    {{- with .hpcJobMapping }}
    hpcJobMapping:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    enablePodLabels: {{ .enablePodLabels }}
    enablePodUID: {{ .enablePodUID }}
    {{- with .podLabelAllowlistRegex }}
    podLabelAllowlistRegex:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .service }}
    service:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .serviceMonitor }}
    serviceMonitor:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .config }}
    {{- if .config.name }}
    config:
      name: {{ .config.name }}
    {{- end }}
    {{- end }}
  {{- end }}
  hostPaths:
    rootFS: {{ .Values.hostPaths.rootFS }}
    driverInstallDir: {{ .Values.hostPaths.driverInstallDir }}
    {{- if .Values.hostPaths.kubeletRootDir }}
    kubeletRootDir: {{ .Values.hostPaths.kubeletRootDir }}
    {{- end }}
  daemonsets:
    {{- toYaml .Values.daemonsets | nindent 4 }}
{{- end }}
